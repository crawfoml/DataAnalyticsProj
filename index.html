<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>NRC findings: does history predict the future?</title>
    <style>
      body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #loading { max-width: 36rem; margin: 18vh auto 0; padding: 0 1rem; color: #333; text-align: center; }
      #loading h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      #loading p { margin: 0.4rem 0; color: #555; line-height: 1.45; }
      .spinner {
        width: 2.5rem; height: 2.5rem; margin: 0 auto;
        border: 4px solid #ddd; border-top-color: #4c72b0; border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading.failed .spinner { display: none; }
      #loading.failed h1 { color: #b3261e; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <h1 id="loading-title">Loading the dashboard</h1>
        <p id="loading-detail">
          This page runs Python in your browser, so there is nothing to install. The first visit downloads Python
          and pandas and can take up to a minute. Later visits are faster.
        </p>
      </div>
      <noscript><p style="text-align:center">This dashboard needs JavaScript.</p></noscript>
    </div>
    <script type="module">
      const STLITE = "https://cdn.jsdelivr.net/npm/@stlite/browser@0.83.0/build";

      function fail(error) {
        console.error(error);
        const box = document.getElementById("loading");
        if (!box) return;
        box.classList.add("failed");
        document.getElementById("loading-title").textContent = "The dashboard could not load";
        document.getElementById("loading-detail").textContent =
          "Check your connection and reload the page. If it keeps failing, a network filter may be blocking cdn.jsdelivr.net.";
      }

      // The stylesheet is large, so load it without blocking the loading message above.
      const stylesheet = new Promise((resolve, reject) => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = `${STLITE}/stlite.css`;
        link.onload = resolve;
        link.onerror = () => reject(new Error("stlite.css failed to load"));
        document.head.appendChild(link);
      });

      (async () => {
        try {
          const [{ mount }] = await Promise.all([import(`${STLITE}/stlite.js`), stylesheet]);

          // The app and its data load from this repository, so this page always matches app.py.
          mount(
            {
              requirements: ["plotly"],
              entrypoint: "app.py",
              files: {
                "app.py": { url: "./app.py" },
                "nrc_model.py": { url: "./nrc_model.py" },
                "cleaned_violations_data.csv": { url: "./cleaned_violations_data.csv" },
                "model_coefficients.json": { url: "./model_coefficients.json" },
              },
            },
            document.getElementById("root"),
          );
        } catch (error) {
          fail(error);
        }
      })();
    </script>
  </body>
</html>
